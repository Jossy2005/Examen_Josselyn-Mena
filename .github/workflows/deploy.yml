name: Deploy Final JAMB

on:
  push:
    branches:
      - bastidas

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bastidas
  IMAGE_TAG: 1.0.5
  REPO_OWNER: jossy2005

permissions:
  contents: read
  packages: write

jobs:
  bastidas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]   # <-- corregido de lista inline a diccionario
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v --tb=short
          echo "✅ Tests completados con éxito!"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REPO_OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build & Push Docker Image as Package
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/despliegue"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🔐 Login en GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ env.REPO_OWNER }} --password-stdin

            echo "📥 Pull de la nueva imagen"
            docker pull ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "🗑️ Borrando stack anterior..."
            docker stack rm bastidas || true

            echo "⏳ Esperando liberación..."
            sleep 20

            echo "🚀 Desplegando stack nuevo..."
            cd ~/despliegue
            docker stack deploy --with-registry-auth -c stack.yml bastidas

            echo "🔍 Verificando servicios..."
            docker service ls
